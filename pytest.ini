[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: teste unitário isolado, sem infraestrutura externa
    integration: teste que combina camadas internas da aplicação
    api: teste de contrato ou rota da API
    smoke: verificação rápida de inicialização ou caminho crítico
    regression: proteção de comportamento previamente validado
    frontend: teste da superfície frontend/Electron
    desktop: teste da superfície desktop/Tkinter
